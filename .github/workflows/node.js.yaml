name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:


jobs:
  check_code:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.12.0, 24]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Node.js 
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck 
      - name: Unit tests
        run: npm run test:unit 